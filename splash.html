<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;600&display=swap');

    :root {
      --bg:        #04050d;
      --ring1:     #00ffe0;
      --ring2:     #7b5ea7;
      --ring3:     #ff4d6d;
      --glow:      rgba(0, 255, 224, 0.18);
      --text:      #e8f0fe;
      --sub:       rgba(232,240,254,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }

    /* ── Starfield ── */
    .stars {
      position: fixed; inset: 0;
      background:
        radial-gradient(1px 1px at  8%  12%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 23%  57%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 47%   9%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 61%  78%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 82%  35%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 92%  88%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35%  44%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 71%  21%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 14%  90%, rgba(255,255,255,.4) 0%, transparent 100%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0%   { opacity: .6; }
      100% { opacity: 1; }
    }

    /* ── Ambient glow ── */
    .ambient {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 60%, rgba(0,255,224,.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 75% 30%, rgba(123,94,167,.09) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Scene wrapper ── */
    .scene {
      position: relative;
      width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Rings ── */
    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .orbit-1 {
      width: 210px; height: 210px;
      border-top-color:   var(--ring1);
      border-right-color: var(--ring1);
      box-shadow: 0 0 18px var(--ring1), inset 0 0 8px rgba(0,255,224,.1);
      animation: spin 2.4s linear infinite;
    }
    .orbit-2 {
      width: 160px; height: 160px;
      border-bottom-color: var(--ring2);
      border-left-color:   var(--ring2);
      box-shadow: 0 0 14px var(--ring2);
      animation: spin 1.8s linear infinite reverse;
    }
    .orbit-3 {
      width: 110px; height: 110px;
      border-top-color:  var(--ring3);
      border-left-color: var(--ring3);
      box-shadow: 0 0 12px var(--ring3);
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Core ── */
    .core {
      width: 55px; height: 55px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, rgba(0,255,224,.45), rgba(123,94,167,.3) 60%, rgba(4,5,13,0) 100%);
      box-shadow: 0 0 30px rgba(0,255,224,.35), 0 0 60px rgba(0,255,224,.12);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.1); opacity: .8; }
    }

    /* ── Text block ── */
    .info {
      position: absolute;
      bottom: -76px;
      left: 50%; transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }
    .title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: .72rem;
      font-weight: 300;
      letter-spacing: .14em;
      color: var(--sub);
    }

    /* ── Dots loader ── */
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ring1);
      opacity: .25;
      animation: dotBlink 1.6s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .26s; background: var(--ring2); }
    .dot:nth-child(3) { animation-delay: .52s; background: var(--ring3); }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: .2; transform: scale(.85); }
      40%            { opacity: 1;  transform: scale(1.2); }
    }

    /* ── Fade-out when done ── */
    body.done {
      animation: fadeOut .6s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="ambient"></div>

  <div class="scene">
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>
    <div class="orbit orbit-3"></div>
    <div class="core"></div>
  </div>
</body>
</html>
