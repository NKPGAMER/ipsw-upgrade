<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,
    body,
    #root {
      margin: 0;
      background: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .aurora-border-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(157, 78, 221, 0.2);
    }

    .aurora-border-wrapper::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(from 0deg,
          #1a73e8,
          #8ab4f8,
          #da70d6,
          #9b5de5,
          #f15bb5,
          #00f5d4,
          #1a73e8);
      animation: aurora-spin 4s linear infinite;
    }

    @keyframes aurora-spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .splash-window {
      position: absolute;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      background-color: #131416;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 30px;
      box-sizing: border-box;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-top: 10px;
    }

    .brand-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 5px;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .brand-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      margin: 0;
      opacity: 0.95;
    }

    .status-container {
      margin-bottom: 10px;
      text-align: center;
    }

    .status-text {
      color: #9aa0a6;
      font-size: 14px;
      letter-spacing: 1px;
      animation: fade-loading 1.5s ease-in-out infinite alternate;
    }

    /* Hiệu ứng thở (Pulse) và mờ tỏ (Fade) giúp giao diện sống động hơn */
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes fade-loading {
      0% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="aurora-border-wrapper">

    <div class="splash-window">

      <div class="brand">
        <img class="brand-logo" src="src/assets/logo.png" alt="">
        <h1 class="brand-title">IPSW Manager</h1>
      </div>

      <div class="status-container">
        <div class="status-text">Đang khởi động...</div>
      </div>

    </div>

  </div>

</body>

</html>
