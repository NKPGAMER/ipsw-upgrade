<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSW Manager</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/overlay.css">
    <link rel="stylesheet" href="assets/styles/page.css">
    <link rel="stylesheet" href="assets/styles/tooltip.css">
    <link rel="stylesheet" href="assets/styles/product.css">
    <link rel="stylesheet" href="assets/styles/index.css">
    <link rel="stylesheet" href="assets/styles/update.css">
</head>

<body>
    <div id="root"></div>
    <header class="hidden p-2.5! w-dvw h-dvh border-b border-(--border-dark) bg-[#111418] sticky top-0 z-1001 max-h-[8vh]
        [&_section]:size-full
        [&_section]:mx-auto
        [&_section]:flex
        [&_section]:items-center
        [&_section]:justify-between
        [&_section]:gap-2
        [&_section]:animate-[fadeIn_0.3s_ease-out]
        [&>section>svg]:w-5.75
        [&>section>svg]:h-5.75
    ">
        <section id="topbar">
            <div class="flex items-center gap-3 shrink-0">
                <div class="text-[18px] font-bold tracking-[-0.01em]">IPSW Manager</div>
            </div>
            <div class="topbar-search">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="m19.485 20.154l-6.262-6.262q-.75.639-1.725.989q-.975.35-1.96.35q-2.402 0-4.066-1.663q-1.664-1.664-1.664-4.065T5.47 5.436q1.663-1.667 4.064-1.667q2.402 0 4.068 1.664q1.666 1.664 1.666 4.067q0 1.042-.369 2.017q-.37.975-.97 1.668l6.262 6.261l-.707.708ZM9.538 14.23q1.99 0 3.361-1.37q1.37-1.37 1.37-3.361q0-1.99-1.37-3.36q-1.37-1.37-3.36-1.37q-1.99 0-3.361 1.37q-1.37 1.37-1.37 3.36q0 1.99 1.37 3.36q1.37 1.37 3.36 1.37Z" />
                    </svg>
                </span>
                <input type="text" class="search-input" id="globalSearchInput" data-t="[placeholder]search">
                <button class="search-clear" id="globalSearchClear">×</button>
            </div>
            <div class="flex items-center gap-2 p-1.5!">
                <button class="topbar-btn has-tooltip tooltip-bottom highlight-glow hidden!" id="app.update.available">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M7 20v-2h10v2H7Zm4-4V7.825L8.4 10.4L7 9l5-5l5 5l-1.4 1.4L13 7.825V16h-2Z" />
                    </svg>
                    <span class="tooltip-text" data-t="app.update.available"></span>
                </button>
                <button class="topbar-btn" id="settingsBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="m10.135 21l-.362-2.892q-.479-.145-1.035-.454q-.557-.31-.948-.664l-2.667 1.135l-1.865-3.25l2.305-1.738q-.044-.272-.073-.56q-.028-.287-.028-.558q0-.252.028-.53t.073-.626L3.258 9.125l1.865-3.212L7.771 7.03q.448-.373.97-.673q.52-.3 1.013-.464L10.134 3h3.731l.362 2.912q.575.201 1.016.463q.442.262.909.654l2.725-1.116l1.865 3.212l-2.382 1.796q.082.31.092.568q.01.26.01.511q0 .233-.02.491q-.019.259-.088.626l2.344 1.758l-1.865 3.25l-2.681-1.154q-.467.392-.94.673q-.474.281-.985.444L13.865 21h-3.73Zm1.838-6.5q1.046 0 1.773-.727q.727-.727.727-1.773q0-1.046-.727-1.773q-.727-.727-1.773-.727q-1.052 0-1.776.727T9.473 12q0 1.046.724 1.773q.724.727 1.776.727Z" />
                    </svg>
                </button>
            </div>
        </section>

        <section id="topbar:selectModel" class="hidden!">
            <div class="flex items-center gap-3 shrink-0">
                <div class="text-[18px] font-bold tracking-[-0.01em]" id="overlayTitle">Loading...</div>
            </div>
            <nav>
                <ol class="breadcrumb" id="breadcrumb_selectModel">
                </ol>
            </nav>
            <div class="flex items-center gap-2 p-1.5!">
                <button class="topbar-btn has-tooltip tooltip-bottom" id="downloadsBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M5 21v-1h14v1H5Zm6.98-3.77L6.366 9.789h3.27V3h4.711v6.788h3.27l-5.635 7.443Zm0-1.634l3.574-4.788h-2.208V4h-2.711v6.808H8.427l3.554 4.788Zm.02-4.788Z" />
                    </svg>
                    <span class="tooltip-text" data-t="button.download"></span>
                </button>
                <button class="topbar-btn has-tooltip tooltip-bottom" id="upgradeAllFirmware">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M7 20v-2h10v2H7Zm4-4V7.825L8.4 10.4L7 9l5-5l5 5l-1.4 1.4L13 7.825V16h-2Z" />
                    </svg>
                    <span class="tooltip-text" data-t="button.upgrade.firmware"></span>
                </button>

                <button class="topbar-btn has-tooltip tooltip-bottom" id="deleteAllFirmware">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26">
                        <path fill="currentColor"
                            d="M11.5-.031c-1.958 0-3.531 1.627-3.531 3.594V4H4c-.551 0-1 .449-1 1v1H2v2h2v15c0 1.645 1.355 3 3 3h12c1.645 0 3-1.355 3-3V8h2V6h-1V5c0-.551-.449-1-1-1h-3.969v-.438c0-1.966-1.573-3.593-3.531-3.593h-3zm0 2.062h3c.804 0 1.469.656 1.469 1.531V4H10.03v-.438c0-.875.665-1.53 1.469-1.53zM6 8h5.125c.124.013.247.031.375.031h3c.128 0 .25-.018.375-.031H20v15c0 .563-.437 1-1 1H7c-.563 0-1-.437-1-1V8zm2 2v12h2V10H8zm4 0v12h2V10h-2zm4 0v12h2V10h-2z" />
                    </svg>
                    <span class="tooltip-text" data-t="tooltip.delete.old.duplicate"></span>
                </button>

                <button class="topbar-btn has-tooltip tooltip-bottom" id="refreshBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12.077 19q-2.931 0-4.966-2.033q-2.034-2.034-2.034-4.964q0-2.93 2.034-4.966Q9.146 5 12.077 5q1.783 0 3.338.847q1.556.847 2.508 2.365V5.5q0-.213.144-.356T18.424 5q.213 0 .356.144q.143.143.143.356v3.923q0 .343-.232.576q-.232.232-.576.232h-3.923q-.212 0-.356-.144t-.144-.357q0-.213.144-.356t.356-.143h3.2q-.78-1.496-2.197-2.364Q13.78 6 12.077 6q-2.5 0-4.25 1.75T6.077 12q0 2.5 1.75 4.25t4.25 1.75q1.787 0 3.271-.968q1.485-.969 2.202-2.572q.085-.197.274-.276q.19-.08.388-.013q.211.067.28.275q.07.208-.015.404q-.833 1.885-2.56 3.017Q14.19 19 12.077 19Z" />
                    </svg>
                    <span class="tooltip-text" data-t="tooltip.refresh"></span>
                </button>

                <button class="topbar-btn" id="topbar.closeBtn">×</button>
            </div>
        </section>
    </header>

    <main class="flex items-center justify-center w-full h-full mx-auto pt-6! px-3!
        [&_section]:animate-[fadeIn_0.5s_ease-in-out]
    ">
        <!-- Main -->
        <section class="size-full overflow-y-auto mx-5!" id="main:selectProduct">
            <div class="text-center mb-8!">
                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="text-[28px] font-bold block mb-1" id="downloadedCount">-</span>
                        <span class="stat-label" data-t="stats.downloaded"></span>
                    </div>
                    <div class="stat-item">
                        <span class="text-[28px] font-bold block mb-1" id="storageUsed">-</span>
                        <span class="stat-label" data-t="stats.used"></span>
                    </div>
                    <div class="stat-item">
                        <span class="text-[28px] font-bold block mb-1" id="freeSpace">-</span>
                        <span class="stat-label" data-t="stats.freeSpace"></span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">
                <div class="product-card" data-product="iphone">
                    <div class="product-icon">
                        <img src="assets/icon/iphone.png" alt="iPhone">
                    </div>
                    <div class="product-name">iPhone</div>
                </div>

                <div class="product-card" data-product="ipad">
                    <div class="product-icon">
                        <img src="assets/icon/ipad.png" alt="iPad">
                    </div>
                    <div class="product-name">iPad</div>
                </div>

                <div class="product-card" data-product="watch">
                    <div class="product-icon">
                        <img src="assets/icon/watch.png" alt="Apple Watch">
                    </div>
                    <div class="product-name">Apple Watch</div>
                </div>

                <div class="product-card" data-product="mac">
                    <div class="product-icon">
                        <img src="assets/icon/mac.png" alt="Mac">
                    </div>
                    <div class="product-name">Mac</div>
                </div>

                <div class="product-card" data-product="realitydevice">
                    <div class="product-icon">
                        <img src="assets/icon/vision.png" alt="Vision Pro">
                    </div>
                    <div class="product-name">Vision Pro</div>
                </div>

                <div class="product-card" data-product="tv">
                    <div class="product-icon">
                        <img src="assets/icon/tv.png" alt="Apple TV">
                    </div>
                    <div class="product-name">Apple TV</div>
                </div>

                <div class="product-card" data-product="homepod">
                    <div class="product-icon">
                        <img src="assets/icon/homepod.png" alt="HomePod">
                    </div>
                    <div class="product-name">HomePod</div>
                </div>

                <div class="product-card" data-product="ipod">
                    <div class="product-icon">
                        <img src="assets/icon/ipod.png" alt="iPod">
                    </div>
                    <div class="product-name">iPod</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Global Search Overlay -->
    <div class="global-search-overlay" id="globalSearchOverlay">
        <div class="search-results-header">
            <div class="search-results-title" id="globalSearchTitle">Search Results</div>
            <button class="overlay-control-btn close" id="closeGlobalSearch">×</button>
        </div>
        <div class="device-grid" id="globalSearchResults"></div>
    </div>

    <!-- Select Device -->
    <div class="fixed inset-0 z-1001 hidden" id="selectDevice"></div>
    
    <!-- Download Page -->
    <div class="fixed inset-0 z-1001 hidden" id="downloadPage"></div>

    <!-- Setting Page -->
    <div class="fixed inset-0 z-1001 hidden" id="settingsPage"></div>

    <!-- Scripts -->
    <script type="module" src="src/App.tsx" defer></script>
</body>
</html>
