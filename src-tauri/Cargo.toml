[package]
name = "ipsw-manager"
version = "5.0.0"
description = ""
authors = ["NKPGAMER"]
license = ""
repository = ""
default-run = "ipsw-manager"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
notify = { version = "7", features = [] }
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
tauri-plugin-store = "2"
directories = "5"
anyhow = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "0.0.12"
