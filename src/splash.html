<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body, #root {
      margin: 0;
      background: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ─── Aurora border ring ─────────────────────────── */
    .aurora-border-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(157, 78, 221, 0.2);
    }

    .aurora-border-wrapper::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: conic-gradient(from 0deg,
        #1a73e8, #8ab4f8, #da70d6, #9b5de5, #f15bb5, #00f5d4, #1a73e8);
      animation: aurora-spin 4s linear infinite;
      border-radius: 50%;
    }

    @keyframes aurora-spin {
      to { transform: rotate(360deg); }
    }

    .aurora-border-wrapper.exit-stop::before {
      animation-play-state: paused;
    }

    /* ─── Main splash content ────────────────────────── */
    .splash-window {
      position: absolute;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      background-color: #131416;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 30px;
      box-sizing: border-box;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-top: 10px;
    }

    .brand-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 5px;
      padding-left: 10px;
      padding-right: 10px;
      display: block;
      animation: pulse 2s ease-in-out infinite alternate;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      margin: 0;
      opacity: 0.95;
    }

    .status-container {
      margin-bottom: 10px;
      text-align: center;
    }

    .status-text {
      color: #9aa0a6;
      font-size: 14px;
      letter-spacing: 1px;
      animation: fade-loading 1.5s ease-in-out infinite alternate;
    }

    .status-text.exit {
      animation: none;
      opacity: 0.6;
    }

    @keyframes pulse {
      from { transform: scale(0.95); opacity: 0.8; }
      to   { transform: scale(1.05); opacity: 1; }
    }

    @keyframes fade-loading {
      from { opacity: 0.4; }
      to   { opacity: 1; }
    }

    /* ─── Phase 1: Dark overlay ──────────────────────── */
    /* position: absolute (không phải fixed) để bị cắt theo
       border-radius + overflow:hidden của .aurora-border-wrapper,
       tránh lộ góc vuông của BrowserWindow trong suốt. */
    .dark-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      transition: opacity 350ms ease;
      will-change: opacity;
    }

    .dark-overlay.in {
      opacity: 1;
    }

    /* ─── Phase 2: Border fill SVG ───────────────────── */
    .border-fill-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 110;
      pointer-events: none;
      opacity: 0;
      transition: opacity 100ms ease;
    }

    .border-fill-svg.in {
      opacity: 1;
    }

    /* ─── Phase 3: Logo glow burst (small, behind logo) ──── */
    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160px;
      height: 160px;
      margin: -80px 0 0 -80px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(155, 93, 229, 0.95) 0%,
        rgba(0, 245, 212, 0.5) 45%,
        transparent 70%);
      filter: blur(16px);
      transform: scale(0);
      z-index: 120;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .logo-glow.in {
      animation: glow-burst 700ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes glow-burst {
      0%   { transform: scale(0); opacity: 0; }
      25%  { opacity: 1; }
      100% { transform: scale(5); opacity: 0; }
    }

    /* ─── Phase 4: Full-screen spreading light ───────── */
    /* Lan tỏa ánh sáng từ giữa khung splash ra cho đến khi phủ kín.
       position: absolute để bị cắt theo border-radius của wrapper,
       không tràn ra ngoài và lộ góc vuông cửa sổ. */
    .screen-flood {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      border-radius: 50%;
      background: radial-gradient(circle,
        #ffffff 0%,
        #e7d6ff 18%,
        #9b5de5 45%,
        #00f5d4 70%,
        rgba(0, 0, 0, 0) 100%);
      transform: scale(0);
      opacity: 0;
      z-index: 145;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .screen-flood.in {
      animation: flood-spread 1100ms cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }

    @keyframes flood-spread {
      0%   { transform: scale(0);  opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: scale(20); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- Main splash -->
  <div class="aurora-border-wrapper" id="auroraWrapper">
    <div class="splash-window">
      <div class="brand">
        <img class="brand-logo" src="./assets/logo.png" alt="" id="brandLogo">
        <h1 class="brand-title">IPSW Manager</h1>
      </div>
      <div class="status-container">
        <div class="status-text" id="statusText">Đang khởi động...</div>
      </div>
    </div>

    <!-- Exit phase layers (nằm trong wrapper để bị cắt theo border-radius,
         tránh lộ góc vuông của BrowserWindow trong suốt phía sau) -->
    <div class="dark-overlay" id="darkOverlay"></div>

    <svg class="border-fill-svg" id="borderFillSvg"
      viewBox="0 0 100 100" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#9b5de5"/>
          <stop offset="40%"  stop-color="#00f5d4"/>
          <stop offset="100%" stop-color="#f15bb5"/>
        </linearGradient>
      </defs>
      <rect id="borderRect"
        x="0.75" y="0.75" width="98.5" height="98.5" rx="5.5"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="0.35"
        vector-effect="non-scaling-stroke"
        stroke-dasharray="0 400"
        pathLength="400"
        stroke-linecap="round"/>
    </svg>

    <div class="logo-glow" id="logoGlow"></div>
    <div class="screen-flood" id="screenFlood"></div>
  </div>

  <script>
    (function () {
      const api = window.splashAPI;

      /* ── Helpers ──────────────────────────────────────────── */
      function raf(fn) { requestAnimationFrame(fn); }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      function animate(duration, onTick, onDone) {
        const start = performance.now();
        function frame(now) {
          const t = Math.min((now - start) / duration, 1);
          onTick(easeInOut(t), t);
          if (t < 1) raf(frame);
          else if (onDone) onDone();
        }
        raf(frame);
      }

      /* ── Main exit sequence ───────────────────────────────── */
      function runAnimation() {
        const wrapper     = document.getElementById('auroraWrapper');
        const overlay     = document.getElementById('darkOverlay');
        const borderSvg   = document.getElementById('borderFillSvg');
        const borderRect  = document.getElementById('borderRect');
        const logoGlow    = document.getElementById('logoGlow');
        const screenFlood = document.getElementById('screenFlood');
        const statusText  = document.getElementById('statusText');

        // Update status hint
        statusText.textContent = 'Đang tắt...';
        statusText.classList.add('exit');

        /* Phase 1 – Dark overlay (350ms) */
        overlay.classList.add('in');

        overlay.addEventListener('transitionend', function onOverlay(e) {
          if (e.propertyName !== 'opacity') return;
          overlay.removeEventListener('transitionend', onOverlay);

          /* Stop spinning aurora */
          wrapper.classList.add('exit-stop');

          /* Phase 2 – Border fill (650ms), mảnh nhờ stroke-width nhỏ + non-scaling-stroke */
          borderSvg.classList.add('in');
          animate(650, function (ease) {
            borderRect.style.strokeDasharray = (ease * 400) + ' ' + ((1 - ease) * 400);
          }, function () {

            /* Phase 3 – Logo glow burst nhỏ quanh logo (700ms) */
            logoGlow.classList.add('in');

            setTimeout(function () {

              /* Phase 4 – Ánh sáng lan tỏa từ giữa màn hình ra cho đến khi phủ kín */
              screenFlood.classList.add('in');

              screenFlood.addEventListener('animationend', function onFlood() {
                screenFlood.removeEventListener('animationend', onFlood);
                /* Animation đã hoàn tất hoàn toàn — bây giờ mới báo done */
                if (api) api.done();
              });

            }, 320);
          });
        });
      }

      /* ── Entry ────────────────────────────────────────────── */
      if (api) {
        api.onReady(runAnimation);
      }
    })();
  </script>
</body>

</html>
